name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 25.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:all

      - name: Verify dist is up to date
        run: git diff --exit-code -- dist

      - name: Generate self-test workflows
        run: npm run generate:self-test

      - name: Verify self-test workflows are up to date
        run: git diff --exit-code -- .github/workflows/self-test.yml.disabled .github/workflows/realistic-test.yml.disabled scripts/self-test-manifest.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm run test:coverage

  node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:all

      - name: Verify dist is up to date
        run: git diff --exit-code -- dist

      - name: Generate self-test workflows
        run: npm run generate:self-test

      - name: Verify self-test workflows are up to date
        run: git diff --exit-code -- .github/workflows/self-test.yml.disabled .github/workflows/realistic-test.yml.disabled scripts/self-test-manifest.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration)
        run: npm run test:all
